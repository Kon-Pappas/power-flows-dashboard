name: Daily Power Flows Fetcher

on:
  schedule:
    # 04:00 UTC = 07:00 Ώρα Ελλάδος (Θερινή) / 06:00 (Χειμερινή)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date (π.χ. 2026-06-10)'
        required: false
        type: string
      end_date:
        description: 'End Date (π.χ. 2026-06-20)'
        required: false
        type: string

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl xlrd

      - name: Run Python script
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: python scripts/update_flows.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Fetcher"
          git add data/historical_flows.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update power flows data" && git push)
